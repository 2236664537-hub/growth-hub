<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>成长工作台 · Daily Growth Hub</title>
<style>
  body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#FFF8F0}
  iframe{width:100%;height:100%;border:none}
  .loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#C9A87C;font-size:16px}
  .spinner{width:40px;height:40px;border:3px solid #F5EDDF;border-top-color:#E8A87C;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="spinner"></div>
  成长工作台加载中...
</div>
<iframe id="app" src="https://cdn.jsdelivr.net/gh/2236664537-hub/growth-hub@main/index.html" onload="document.getElementById('loading').style.display='none'"></iframe>
</body>
</html>

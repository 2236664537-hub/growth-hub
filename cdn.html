<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>成长工作台 · Daily Growth Hub</title>
<style>
  body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#FFF8F0}
  iframe{width:100%;height:100%;border:none}
  .loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#C9A87C;font-size:16px}
  .spinner{width:40px;height:40px;border:3px solid #F5EDDF;border-top-color:#E8A87C;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="spinner"></div>
  成长工作台加载中...
</div>
<iframe id="app" src="about:blank"></iframe>
<script>
// 多个 CDN 源，逐个尝试
const SOURCES = [
  'https://raw.githubusercontent.com/2236664537-hub/growth-hub/main/index.html',
  'https://cdn.jsdelivr.net/gh/2236664537-hub/growth-hub@main/index.html',
  'https://unpkg.com/growth-hub@latest/index.html',
  'https://2236664537-hub.github.io/growth-hub/index.html'
];
let idx = 0;
function tryNext(){
  if(idx >= SOURCES.length){
    document.getElementById('loading').innerHTML = '<div style="color:#D81B60;font-size:18px">⚠️ 加载失败</div><div style="font-size:13px;margin-top:8px;color:#999">请检查网络后刷新重试</div>';
    return;
  }
  const url = SOURCES[idx];
  console.log('尝试加载:', url);
  const iframe = document.getElementById('app');
  iframe.src = url;
  idx++;
}
// 第一个源加载成功后隐藏 loading
document.getElementById('app').onload = function(){
  document.getElementById('loading').style.display = 'none';
};
document.getElementById('app').onerror = tryNext;
tryNext();
</script>
</body>
</html>
